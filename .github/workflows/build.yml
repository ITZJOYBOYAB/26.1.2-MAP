name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install Java 25 for toolchain compilation
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      # 2. Install Java 21 LAST so it stays as the active runtime for Gradle
      - name: Set up Java 21 (for running Gradle)
        id: setup-java-21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      # Run Gradle strictly using Java 21
      - name: Build Mod
        env:
          JAVA_HOME: ${{ steps.setup-java-21.outputs.path }}
        run: gradle build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Jar
          path: build/libs/*[!dev].jar
